[package]
name = "synth"
version = "0.3.4"
edition = "2021"
# the dependencies' floor; ratatui, mlua, and comfy-table need 1.88
rust-version = "1.88"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
comfy-table = "8.0.1"
cpal = "0.18.2"
crossterm = "0.29.0"
ratatui = "0.30"
rtrb = "0.4.0"
serde_json = "1.0.154"
sha2 = "0.10.9"
signal-hook = "0.3"
tracing = "0.1.44"

[dependencies.clap]
version = "4.6.6"
features = ["derive"]

[dependencies.mlua]
version = "0.12"
features = ["luajit", "vendored", "serialize", "error-send"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter"]

# `pub` should mean "used outside the library", so anything marked pub that
# main.rs and tests/ cannot reach is flagged
[lints.rust]
unreachable_pub = "warn"
unsafe_code = "forbid"

# modules live in `name.rs` beside a `name/` directory, never `name/mod.rs`
[lints.clippy]
mod_module_files = "warn"

[dev-dependencies]
realfft = "3.5.1"
