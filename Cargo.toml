[package]
name = "synth"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
comfy-table = "8.0.1"
cpal = "0.18.2"
crossterm = "0.29.0"
ratatui = "0.29.0"
rtrb = "0.4.0"
tracing = "0.1.44"

[dependencies.clap]
version = "4.6.6"
features = ["derive"]

[dependencies.mlua]
version = "0.12"
features = ["luajit", "vendored", "serialize", "error-send"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter"]
