[package]
name = "synth"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
comfy-table = "8.0.1"
# pulseaudio: a pure-Rust client for the PulseAudio protocol, which
# PipeWire also serves; tried before ALSA, so a static build still plays
cpal = { version = "0.18.2", features = ["pulseaudio"] }
crossterm = "0.29.0"
ratatui = "0.30"
rtrb = "0.4.0"
signal-hook = "0.3"
tracing = "0.1.44"

[dependencies.clap]
version = "4.6.6"
features = ["derive"]

[dependencies.mlua]
version = "0.12"
features = ["luajit", "vendored", "serialize", "error-send"]

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.tracing-subscriber]
version = "0.3.23"
features = ["env-filter"]

# `pub` should mean "used outside the library", so anything marked pub that
# main.rs and tests/ cannot reach is flagged
[lints.rust]
unreachable_pub = "warn"

# modules live in `name.rs` beside a `name/` directory, never `name/mod.rs`
[lints.clippy]
mod_module_files = "warn"

[dev-dependencies]
realfft = "3.5.1"

# The pure-Rust PulseAudio client cannot keep a short buffer fed unoptimized,
# so debug builds (`mise run tui`) starve the stream. Optimizing only the
# audio path keeps synth's own code debuggable.
[profile.dev.package.pulseaudio]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3
