name: test-platform

# The Rust tests, network tests, and clippy on one platform, through the
# same mise tasks as Linux. test.yml calls this once per platform beyond Linux; the Lua,
# license and version checks give the same answer everywhere, so they run
# on Linux only.
on:
  workflow_call:
    inputs:
      os:
        description: runner image, such as macos-latest or windows-latest
        required: true
        type: string

permissions:
  contents: read

env:
  MISE_JOBS: 1
  MISE_TASK_OUTPUT: interleave
  # The tasks are written for bash, and mise runs them with cmd on Windows.
  # Git Bash is on Windows runners. mise ignores these two settings in a
  # project's mise.toml, so a repository cannot choose a user's shell; set
  # here, they apply to this workflow only. Unused on macOS.
  MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: bash -o errexit -c
  MISE_WINDOWS_DEFAULT_FILE_SHELL_ARGS: bash
  # `mise run` would first install every tool in mise.toml, the Linux-only
  # lint tools included, through GitHub's API; only Rust is installed here
  MISE_TASK_RUN_AUTO_INSTALL: false
  # authenticates any GitHub API call mise still makes, past the
  # unauthenticated rate limit
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  test:
    runs-on: ${{ inputs.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Rust only: the other tools serve the Linux-only checks
      - name: Install Rust
        uses: jdx/mise-action@v5
        with:
          install_args: rust

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # compiles and runs the #[cfg(windows)] and #[cfg(target_os = "macos")]
      # code nothing on Linux does
      - name: Test
        run: mise run test:rust

      # update replaces the running binary, which each platform does its own
      # way; the token lifts GitHub's API limit
      - name: Test network
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run test:network

      - name: Lint
        run: mise run lint:rust
