name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# mise prefixes parallel task output with the task's label, and Actions only
# reads a workflow command such as ::error:: at the start of a line.
# One task at a time, unprefixed, keeps every annotation.
env:
  MISE_JOBS: 1
  MISE_TASK_OUTPUT: interleave

jobs:
  # the static Linux release binary, built here so a break shows on the PR
  # rather than at release
  musl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v5

      # static alsa-lib, the cargo registry, and target/; like the cargo
      # cache in test, only main saves
      - name: Restore musl cache
        uses: actions/cache/restore@v6
        with:
          path: target/musl
          key: musl-${{ hashFiles('Cargo.lock', 'mise-tasks/build/musl') }}
          restore-keys: musl-

      - name: Build
        run: mise run build:musl

      - name: Save musl cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: target/musl
          key: musl-${{ hashFiles('Cargo.lock', 'mise-tasks/build/musl') }}

      # the runner is glibc Ubuntu: the binary must start with nothing to load
      - name: Run static binary
        run: |
          set -euo pipefail
          bin=target/musl/x86_64-unknown-linux-musl/release/synth
          file "$bin" | grep -q 'static-pie linked'
          "$bin" check lua/example.lua

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base branch and every tag, for the version check

      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install tools
        uses: jdx/mise-action@v5

      # ~/.cargo and target/, keyed on rustc and Cargo.lock; after mise, so
      # rustc is on PATH. Only main saves: PRs restore main's cache and never
      # write their own, which would crowd it out of the repo's 10 GB.
      # Pinned to a commit, since it is a third-party action.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # a PR that changes the version is checked here, before merge, so a bad
      # bump never reaches main. Only on PRs: after merge, release.yml runs
      # the same check and may already have created the tag.
      - name: Check version
        if: github.event_name == 'pull_request'
        env:
          VERSION_BASE: origin/${{ github.base_ref }}
        run: mise run version

      - name: Test
        run: mise run test

      - name: Lint
        run: mise run lint
