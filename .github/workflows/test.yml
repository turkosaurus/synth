name: test

on:
  push:
    branches: [main]
    # bench.yml's daily results commit changes no code
    paths-ignore: ["benches/results/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Cancel for newer runs on non-main branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# mise prefixes parallel task output with the task's label, and Actions only
# reads a workflow command such as ::error:: at the start of a line.
# One task at a time, unprefixed, keeps every annotation.
env:
  MISE_JOBS: 1
  MISE_TASK_OUTPUT: interleave

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the base branch and every tag, for the version check

      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install tools
        uses: jdx/mise-action@v5

      # ~/.cargo and target/, keyed on rustc and Cargo.lock; after mise, so
      # rustc is on PATH. Only main saves: PRs restore main's cache and never
      # write their own, which would crowd it out of the repo's 10 GB.
      # Pinned to a commit, since it is a third-party action.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # a PR that changes the version is checked here, before merge, so a bad
      # bump never reaches main. Only on PRs: after merge, release.yml runs
      # the same check and may already have created the tag.
      - name: Check version
        if: github.event_name == 'pull_request'
        env:
          VERSION_BASE: origin/${{ github.base_ref }}
        run: mise run version

      # the workflow's token lifts GitHub's API limit for `update`
      - name: Test
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run tests

      - name: Lint
        run: mise run lint

  macos:
    uses: ./.github/workflows/test-platform.yml
    with:
      os: macos-latest

  windows:
    uses: ./.github/workflows/test-platform.yml
    with:
      os: windows-latest

  # the check main's ruleset requires. It runs even when a platform fails,
  # since a skipped required check counts as passed, and fails unless every
  # platform succeeded.
  test:
    needs: [linux, macos, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every platform passed
        env:
          LINUX: ${{ needs.linux.result }}
          MACOS: ${{ needs.macos.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          failed=0
          if [ "$LINUX" != success ]; then
            echo "::error title=test::linux: $LINUX"
            failed=1
          fi
          if [ "$MACOS" != success ]; then
            echo "::error title=test::macos: $MACOS"
            failed=1
          fi
          if [ "$WINDOWS" != success ]; then
            echo "::error title=test::windows: $WINDOWS"
            failed=1
          fi
          exit "$failed"
