name: bench

# Times the render path and counts its instructions.
# - on each merge to main: compared with main's last result, and committed
#   to benches/results/, one file per run; daily as well, which skips when
#   nothing changed
# - on a PR ready for review: compared with main's last result, from the
#   history the merge commit carries, and posted as a comment. Main's
#   ruleset requires this check, so a regression blocks the merge; a PR
#   that costs more on purpose merges by admin bypass
# Instruction counts repeat across runners, so history serves the
# regression check. Time compares only on the same CPU model, so a PR's
# time table is often empty.
# Separate from test.yml, so benchmarking never holds up the test check.
on:
  push:
    branches: [main]
    # the results commit itself
    paths-ignore: ["benches/results/**"]
  schedule:
    - cron: "35 2 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

# A push is grouped by commit, so a merge right after another still gets
# its own run instead of replacing the one waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MISE_JOBS: 1
  MISE_TASK_OUTPUT: interleave

jobs:
  bench:
    # a draft is still changing; marking it ready runs this
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write # the results commit on main
      pull-requests: write # the comparison comment on a PR
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the last benchmarked commit, for the skip check
          # the results commit pushes with these credentials. BENCH_TOKEN,
          # when set, is one that main's ruleset lets through; without it
          # the workflow's own token is used
          token: ${{ secrets.BENCH_TOKEN || github.token }}

      # main gains a results commit each run, so "changed" means changed
      # outside benches/results/ since the commit the last result measured
      - name: Skip if main is unchanged since its last result
        id: changed
        if: github.event_name != 'pull_request'
        run: |
          last=$(find benches/results -name '*.toml' 2>/dev/null | sort | tail -1)
          commit=""
          if [ -n "$last" ]; then
            commit=$(sed -n 's/^commit = "\(.*\)"$/\1/p' "$last")
          fi
          if [ -n "$commit" ] && git diff --quiet "$commit" HEAD -- . ':!benches/results'; then
            echo "::notice title=bench::main is unchanged since $commit; nothing to measure"
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi

      # Valgrind for the instruction count; gungraun-runner comes from mise
      - name: Install ALSA headers and Valgrind
        if: steps.changed.outputs.run != 'false'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev valgrind

      - name: Install tools
        if: steps.changed.outputs.run != 'false'
        uses: jdx/mise-action@v5

      # Pinned to a commit, since it is a third-party action.
      - name: Cache cargo
        if: steps.changed.outputs.run != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # the saved file's path is the last line on stdout
      - name: Bench
        id: bench
        if: steps.changed.outputs.run != 'false'
        run: |
          set -o pipefail
          file=$(mise run bench:record | tail -1)
          echo "file=$file" >>"$GITHUB_OUTPUT"

      # bench:compare writes the job summary itself; the copy kept here is
      # for the PR comment. A regression is held until the last step, so
      # the result is still committed and the comment still posted.
      - name: Compare
        id: compare
        if: steps.changed.outputs.run != 'false'
        env:
          NEW: ${{ steps.bench.outputs.file }}
        run: |
          # exit 2 is a regression; any other failure fails here
          code=0
          mise run bench:compare "$NEW" >comparison.md || code=$?
          if [ "$code" = 2 ]; then
            echo "regressed=true" >>"$GITHUB_OUTPUT"
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi

      # main's ruleset requires status checks, so this push needs either
      # BENCH_TOKEN or a ruleset that admits the workflow's token. A push
      # with BENCH_TOKEN starts workflows, and paths-ignore keeps it from
      # starting this one.
      # Main may have moved during the run; the result is a new file, so
      # rebasing onto it never conflicts.
      - name: Commit the result
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.changed.outputs.run != 'false'
        env:
          FILE: ${{ steps.bench.outputs.file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -q -m "bench: results for $GITHUB_SHA"
          for attempt in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              exit 0
            fi
            echo "push attempt $attempt failed; retrying" >&2
            sleep $((attempt * 5))
          done
          echo "::error title=bench::could not push the result to main"
          exit 1

      # a fork's PR gets a read-only token, so it has only the job summary
      - name: Comment on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file comparison.md --edit-last || gh pr comment "$PR" --body-file comparison.md

      - name: Fail on a regression
        if: steps.compare.outputs.regressed == 'true'
        run: |
          echo "::error title=bench::instructions rose beyond the regression limit; see the job summary"
          exit 1
