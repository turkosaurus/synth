name: release

# Versions are bumped only by PR (mise run bump <part>), where test.yml checks
# them. Merging such a PR releases it: the tag follows Cargo.toml.
on:
  push:
    branches: [main]
    paths: ["Cargo.toml"]
  # retries a failed release of the version Cargo.toml has now
  workflow_dispatch:

permissions:
  contents: write

# unprefixed task output, so annotations reach Actions; see test.yml
env:
  MISE_JOBS: 1
  MISE_TASK_OUTPUT: interleave

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the parent commit and every tag

      - name: Install tools
        uses: jdx/mise-action@v5

      # a push compares with the commit before it; a manual retry has nothing
      # to compare with, and releases the version as it stands
      - name: Check version
        id: check
        env:
          VERSION_BASE: ${{ github.event_name == 'push' && 'HEAD^' || '' }}
        run: mise run version

  test:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/test.yml

  # one notices file covers every target: about.toml lists all three, so
  # each archive carries the licenses of everything any build links
  notices:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v5

      - name: Write notices
        run: mise run notices THIRD-PARTY-NOTICES.txt

      - name: Upload notices
        uses: actions/upload-artifact@v7
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.txt

  build:
    needs: [version, test, notices]
    strategy:
      fail-fast: true
      matrix:
        include:
          # the binary needs the build host's glibc or newer;
          # 24.04 (glibc 2.39) keeps it running on 24.04 and later
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # cpal links the system audio API.
      # macOS and Windows ship their audio APIs;
      # only Linux needs the headers installed.
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build ${{ matrix.target }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Download notices
        uses: actions/download-artifact@v8
        with:
          name: notices

      # GPL-3.0 and the dependencies' licenses travel with the binary
      - name: Package ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          dir=target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then bin=synth.exe; else bin=synth; fi
          mkdir pkg
          cp "$dir/$bin" LICENSE THIRD-PARTY-NOTICES.txt pkg/
          tar -czf synth-${{ matrix.target }}.tar.gz -C pkg .

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v7
        with:
          name: synth-${{ matrix.target }}
          path: synth-${{ matrix.target }}.tar.gz

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Create release v${{ needs.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
