name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Cargo.toml"]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # parent commit

      - uses: jdx/mise-action@v5

      - id: check
        shell: bash
        run: |
          set -euo pipefail

          # from the revision, not the working tree, so the parent commit's
          # version is readable without checkout
          version_of() {
            git show "$1:Cargo.toml" | yq -p toml -r '.package.version'
          }

          new=$(version_of HEAD)
          # a manual run has no bump to compare against, so it releases the
          # version as it stands. The tag and forward checks below still apply.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            old=""
          else
            old=$(version_of 'HEAD^' || true)
          fi
          echo "version=$new" >>"$GITHUB_OUTPUT"

          if [ -z "$new" ]; then
            echo "::error::no version found in [package]"
            exit 1
          fi

          # Cargo.toml changed for another reason, a dependency most likely.
          # Not a release, not a failure.
          if [ "$new" = "$old" ]; then
            echo "release=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Cargo.toml changed, but version stayed $new; nothing to release"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then
            echo "::error::tag v$new already exists"
            exit 1
          fi

          # require forward
          latest=$(git tag --list 'v*' | sed 's/^v//' | sort -V | tail -1)
          if [ -n "$latest" ]; then
            highest=$(printf '%s\n%s\n' "$latest" "$new" | sort -V | tail -1)
            if [ "$highest" != "$new" ] || [ "$new" = "$latest" ]; then
              echo "::error::$new does not move forward from $latest"
              exit 1
            fi
          fi

          echo "release=true" >>"$GITHUB_OUTPUT"
          echo "::notice::releasing v$new, previous tag ${latest:-none}"

  test:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: jdx/mise-action@v5
      - run: mise run test

  tag:
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pushed with the default token, which deliberately does not trigger more workflow runs
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "release v$VERSION"
          git push origin "v$VERSION"

  build:
    needs: [version, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # cpal links the system audio API.
      # macOS and Windows ship their audio APIs;
      # only Linux needs the headers installed.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - run: cargo build --release --target ${{ matrix.target }}

      - shell: bash
        run: |
          set -euo pipefail
          dir=target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then bin=synth.exe; else bin=synth; fi
          tar -czf synth-${{ matrix.target }}.tar.gz -C "$dir" "$bin"

      - uses: actions/upload-artifact@v7
        with:
          name: synth-${{ matrix.target }}
          path: synth-${{ matrix.target }}.tar.gz

  release:
    needs: [version, tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" dist/* --generate-notes --repo "$GITHUB_REPOSITORY"
