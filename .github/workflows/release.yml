name: release

# Every push to main publishes a GitHub release, created once with every asset.
# It is a prerelease unless the push bumps Cargo.toml to a stable X.Y.Z.
# Versions are bumped only by PR (mise run bump <part>), where test.yml checks
# them; the tag follows Cargo.toml. Any other push is a dev build, tagged
# v<version>+<sha7>.
on:
  push:
    branches: [main]
    # bench.yml's daily results commit changes no code, so it is no build
    paths-ignore: ["benches/results/**"]
  # retries a failed release of the version Cargo.toml has now
  workflow_dispatch:

permissions:
  contents: write

# unprefixed task output, so annotations reach Actions; see test.yml
env:
  MISE_JOBS: 1
  MISE_TASK_OUTPUT: interleave

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      build: ${{ steps.name.outputs.build }}
      prerelease: ${{ steps.name.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the parent commit and every tag

      - name: Install tools
        uses: jdx/mise-action@v5

      # a push compares with the latest release; a manual retry has nothing
      # to compare with, and releases the version as it stands
      - name: Check version
        id: check
        env:
          VERSION_BASE: ${{ github.event_name == 'push' && 'latest' || '' }}
        run: mise run version

      # semver build metadata names the commit without ordering it,
      # so a dev build shows what it was built from and never outranks a release
      - name: Name the build
        id: name
        env:
          RELEASE: ${{ steps.check.outputs.release }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          if [ "$RELEASE" = true ]; then
            tag="v$VERSION"
          else
            tag="v$VERSION+${GITHUB_SHA::7}"
          fi
          case $tag in
          *-* | *+*) prerelease=true ;;
          *) prerelease=false ;;
          esac
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
          echo "build=${tag#v}" | tee -a "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: version
    uses: ./.github/workflows/test.yml

  # one notices file covers every target: about.toml lists all three, so
  # each archive carries the licenses of everything any build links
  notices:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v5

      - name: Write notices
        run: mise run notices THIRD-PARTY-NOTICES.txt

      - name: Upload notices
        uses: actions/upload-artifact@v7
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.txt

  build:
    needs: [version, test, notices]
    strategy:
      fail-fast: true
      matrix:
        include:
          # pinned, not ubuntu-latest: the binary needs the glibc it was built
          # against or newer, so the runner sets the oldest Linux it runs on.
          # 24.04 has glibc 2.39; ubuntu-latest moved to 26 (2.43), and its
          # binaries would fail on 24.04 with `GLIBC_2.43 not found`.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # cpal links the system audio API.
      # macOS and Windows ship their audio APIs;
      # only Linux needs the headers installed.
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # --version prints the tag without its v
      - name: Build ${{ matrix.target }}
        env:
          SYNTH_VERSION: ${{ needs.version.outputs.build }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Download notices
        uses: actions/download-artifact@v8
        with:
          name: notices

      # GPL-3.0 and the dependencies' licenses travel with the binary
      - name: Package ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          dir=target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then bin=synth.exe; else bin=synth; fi
          mkdir pkg
          cp "$dir/$bin" LICENSE THIRD-PARTY-NOTICES.txt pkg/
          tar -czf synth-${{ matrix.target }}.tar.gz -C pkg .

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v7
        with:
          name: synth-${{ matrix.target }}
          path: synth-${{ matrix.target }}.tar.gz

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      # one call with every asset, so a release is never seen half uploaded
      - name: Create release ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --prerelease="$PRERELEASE" \
            --repo "$GITHUB_REPOSITORY"

  # the release just published, end to end: its Linux build finds it on the
  # release page by its channel, downloads, verifies, and unpacks it
  verify:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download the Linux build
        uses: actions/download-artifact@v8
        with:
          name: synth-x86_64-unknown-linux-gnu

      - name: Update dry run to ${{ needs.version.outputs.tag }}
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xzf synth-x86_64-unknown-linux-gnu.tar.gz
          case $TAG in
          *+*) channel=(--dev "${TAG##*+}") ;;
          *-*) channel=(--beta) ;;
          *) channel=(--stable) ;;
          esac
          out=$(./synth update --dry-run "${channel[@]}")
          echo "$out"
          if [[ $out != "synth ${TAG#v} verified;"* ]]; then
            echo "::error::update --dry-run ${channel[*]} did not find $TAG"
            exit 1
          fi

  # install.ps1 end to end from the release just published, once per release:
  # it installs the latest stable, so a PR would test nothing new
  winstall:
    needs: [version, release]
    runs-on: windows-latest
    env:
      # the task is bash, and mise runs file tasks with cmd on Windows;
      # see test-platform.yml
      MISE_WINDOWS_DEFAULT_FILE_SHELL_ARGS: bash
      MISE_TASK_RUN_AUTO_INSTALL: false
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # the task needs only the PowerShells the runner ships
      - name: Install mise
        uses: jdx/mise-action@v5
        with:
          install: false

      - name: Install, run, and uninstall with install.ps1
        run: mise run test:winstall
