[tools]
rust = "1.98"

[tasks.test]
depends = ["test:rust", "check"]
description = "run all tests: cargo tests and the example patch lint"

[tasks."test:rust"]
description = "cargo tests"
run = "cargo test --verbose -- --show-output"

[tasks.play]
description = "play the example patch, then show the debug log"
run = "cargo run -- play lua/example.lua; cat synth.log"

[tasks.log]
description = "follow the debug log; pair with a TUI in another pane"
run = "touch synth.log; tail -F synth.log"

[tasks.doctor]
description = "report terminal capabilities and gating mode"
run = "cargo run -- doctor"

[tasks.check]
description = "lint example.lua; nonzero exit on warnings"
run = "cargo run -- check lua/example.lua"

[tasks.tui]
description = "play live from the keyboard with the default voice"
run = "cargo run -- tui"
