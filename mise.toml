[tools]
rust = "1.98"
# the release workflow reads Cargo.toml's version with it
yq = "4"

# cargo-edit compiles for minutes, so it is fetched here on first use rather
# than listed in [tools], where every CI run would install it
[tasks.bump]
description = "bump the crate version in Cargo.toml and Cargo.lock: mise run bump <patch|minor|major>"
run = "mise exec cargo:cargo-edit@0.13 -- cargo set-version --bump"

[tasks."test:separation"]
description = "lua stays in script.rs and script/, cpal stays in audio/device.rs"
run = '''
set -eu
failed=0
# allowed paths are extended regexes, anchored at the start
for rule in 'mlua:src/script(\.rs|/)' 'cpal:src/audio/device\.rs'; do
  name=${rule%%:*}
  allowed=${rule#*:}
  if offenders=$(grep -rln "use $name\|$name::" src/ | grep -vE "^($allowed)"); then
    echo "$name must stay in $allowed, found in:" >&2
    echo "$offenders" >&2
    failed=1
  fi
done
exit $failed
'''

[tasks.test]
depends = ["test:rust", "test:separation", "test:example"]
description = "run all tests: cargo tests and the example patch lint"

[tasks.lint]
description = "clippy on every target; any warning fails"
run = "cargo clippy --all-targets -- -D warnings"

[tasks."lint:pedantic"]
description = "clippy pedantic, for review; reports but never fails"
run = "cargo clippy --all-targets -- -W clippy::pedantic"

[tasks."test:rust"]
description = "cargo tests"
run = "cargo test --verbose -- --show-output"

[tasks.play]
description = "play the example patch, then show the debug log"
run = "cargo run -- play lua/example.lua; cat synth.log"

[tasks.log]
description = "follow the debug log; pair with a TUI in another pane"
run = "touch synth.log; tail -F synth.log"

[tasks.doctor]
description = "report terminal capabilities and gating mode"
run = "cargo run -- doctor"

[tasks."test:example"]
description = "lint example.lua; nonzero exit on warnings"
run = "cargo run -- check lua/example.lua"

[tasks.tui]
description = "play live from the keyboard with the default instrument"
run = "cargo run -- tui"
