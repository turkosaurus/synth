[tools]
rust = { version = "1.98", components = "clippy,rustfmt" }
yq = "4"
lua-language-server = "3"
stylua = "2"
cargo-deny = "0.20"
"ubi:EmbarkStudios/cargo-about" = "0.9"

[tasks.doctor]
description = "report terminal capabilities and gating mode"
run = "cargo run -- doctor"

[tasks.log]
description = "follow the debug log; pair with a TUI in another pane"
run = "touch synth.log; tail -F synth.log"

[tasks.play]
description = "play the example patch, then show the debug log"
# synth writes synth.log only when RUST_LOG is set
env = { RUST_LOG = "synth=debug" }
run = "cargo run -- play lua/example.lua; cat synth.log"

[tasks.tui]
description = "play live from the keyboard with the default instrument"
run = "cargo run -- tui"


### TEST ###

[tasks.test]
depends = ["test:rust", "test:separation", "test:core", "test:example"]
description = "run the offline tests: cargo tests and the example patch lint; test:network is separate"

[tasks."test:rust"]
description = "cargo tests"
run = "cargo test --verbose -- --show-output || { echo '::error title=test:rust::cargo test failed'; exit 1; }"

# #[ignore]d tests in tests/network.rs; CI runs them beside test
[tasks."test:network"]
description = "tests that reach GitHub releases"
run = "cargo test --test network -- --ignored || { echo '::error title=test:network::network tests failed'; exit 1; }"

[tasks."test:example"]
description = "lint example.lua; nonzero exit on warnings"
run = "cargo run -- check lua/example.lua || { echo '::error file=lua/example.lua,title=test:example::synth check found warnings'; exit 1; }"

### LINT ###

[tasks.lint]
depends = [
    "lint:fmt",
    "lint:rust",
    "lint:pedantic",
    "lint:lua",
    "lint:stylua",
    "lint:licenses",
]
description = "run all linters; any warning fails, except pedantic"

[tasks."lint:fmt"]
description = "cargo fmt check on the crate; any difference fails"
run = "cargo fmt --check || { echo '::error title=lint:fmt::the crate is not formatted; run cargo fmt'; exit 1; }"

[tasks."lint:rust"]
description = "clippy on every target; any warning fails"
run = "cargo clippy --all-targets -- -D warnings || { echo '::error title=lint:rust::clippy found warnings'; exit 1; }"

[tasks."lint:pedantic"]
description = "clippy pedantic, for review; reports but never fails"
run = "cargo clippy --all-targets -- -W clippy::pedantic"

[tasks."lint:stylua"]
description = "stylua formatting check on lua/; any difference fails"
run = '''
code=0
stylua --check lua || code=$?
case $code in
  0) ;;
  1) echo '::error title=lint:stylua::lua/ is not formatted; run stylua lua'; exit 1 ;;
  *) echo '::error title=lint:stylua::stylua could not run; see its error above (stylua.toml or Lua syntax)'; exit 1 ;;
esac
'''

### RELEASE ###

[tasks.bump]
description = "bump the crate version in Cargo.toml and Cargo.lock: mise run bump <patch|minor|major>"
run = "mise exec cargo:cargo-edit@0.13 -- cargo set-version --bump"
