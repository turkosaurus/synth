[tools]
rust = { version = "1.98", components = "clippy,rustfmt" }
yq = "4"
lua-language-server = "3"
neovim = "0.12" # lint:lsp - hover and completion checks
jq = "1"
stylua = "2"
cargo-deny = "0.20"
shellcheck = "0.11"
"ubi:EmbarkStudios/cargo-about" = "0.9"
# runs benches/instructions.rs under Valgrind; 
# must match the gungraun crate's version exactly. 
# Valgrind itself comes from the system's package manager; Linux only.
"github:gungraun/gungraun" = { version = "0.20.0", filter_bins = "gungraun-runner", os = ["linux"] }


### RUN ###

[tasks.doctor]
description = "report terminal capabilities and gating mode"
run = "cargo run -- doctor"

[tasks.log]
description = "follow the debug log; pair with a TUI in another pane"
run = 'tail -F "${XDG_STATE_HOME:-$HOME/.local/state}/synth/synth.log"'

# play and tui run the audio callback in real time. Debug by default: the
# slowest render loop, a worst case to compare against. --release builds
# optimized, as releases do, but a rebuild takes about 15 s, not 2 s.

[tasks.play]
description = "play the example patch, then show the debug log; --release builds optimized"
usage = 'flag "--release" help="build optimized, as releases are"'
# synth always logs faults to ${XDG_STATE_HOME:-$HOME/.local/state}/synth/synth.log;
# RUST_LOG adds the rest
env = { RUST_LOG = "synth=debug" }
run = 'cargo run ${usage_release:+--release} -- play lua/example.lua; cat "${XDG_STATE_HOME:-$HOME/.local/state}/synth/synth.log"'

[tasks.tui]
description = "play live from the keyboard, a patch or the default instrument; --release builds optimized"
usage = '''
flag "--release" help="build optimized, as releases are"
arg "[patch]" help="the patch to play; the default instrument without one"
'''
run = 'cargo run ${usage_release:+--release} -- tui ${usage_patch:+"$usage_patch"}'


### TEST ###

[tasks.tests]
depends = ["test:*"]
description = "every test:* task, network included"

[tasks."test:local"]
depends = ["test:rust", "test:separation", "test:core", "test:example"]
description = "tests that need no network"

[tasks."test:rust"]
description = "cargo tests"
run = "cargo test --verbose -- --show-output || { echo '::error title=test:rust::cargo test failed'; exit 1; }"

# integration tests that reach GitHub are #[ignore]d and skipped;
# update test runs them
[tasks."test:update"]
description = "update against GitHub releases"
# they run target/debug/synth, which the other cargo tasks may be relinking
wait_for = ["test:rust", "test:example"]
run = "cargo test --test update -- --ignored || { echo '::error title=test:update::update tests failed'; exit 1; }"

[tasks."test:example"]
description = "lint example.lua; nonzero exit on warnings"
run = "cargo run -- check lua/example.lua || { echo '::error file=lua/example.lua,title=test:example::synth check found warnings'; exit 1; }"


### LINT ###

[tasks.lint]
depends = [
    "lint:fmt",
    "lint:rust",
    "lint:pedantic",
    "lint:doc",
    "lint:lua",
    "lint:lsp",
    "lint:stylua",
    "lint:licenses",
    "lint:ps1",
    "lint:shell",
]
description = "run all linters; any warning fails, except pedantic"

[tasks."lint:fmt"]
description = "cargo fmt check on the crate; any difference fails"
run = "cargo fmt --check || { echo '::error title=lint:fmt::the crate is not formatted; run cargo fmt'; exit 1; }"

[tasks."lint:rust"]
description = "clippy on every target; any warning fails"
run = "cargo clippy --all-targets -- -D warnings || { echo '::error title=lint:rust::clippy found warnings'; exit 1; }"

[tasks."lint:pedantic"]
description = "clippy pedantic, for review; reports but never fails"
run = "cargo clippy --all-targets -- -W clippy::pedantic"

[tasks."lint:doc"]
description = "cargo doc on the crate; any warning fails"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps || { echo '::error title=lint:doc::cargo doc found warnings'; exit 1; }"

[tasks."lint:stylua"]
description = "stylua formatting check on lua/, tests/lua/, and tests/nvim/; any difference fails"
run = '''
code=0
stylua --check lua tests/lua tests/nvim || code=$?
case $code in
  0) ;;
  1) echo '::error title=lint:stylua::Lua is not formatted; run stylua lua tests/lua tests/nvim'; exit 1 ;;
  *) echo '::error title=lint:stylua::stylua could not run; see its error above (stylua.toml or Lua syntax)'; exit 1 ;;
esac
'''


### RELEASE ###

[tasks.bump]
description = "bump the crate version in Cargo.toml and Cargo.lock: mise run bump <patch|minor|major>"
run = "mise exec cargo:cargo-edit@0.13 -- cargo set-version --bump"
