[tools]
rust = "1.98"

[tasks."test:separation"]
description = "lua stays in script/, cpal stays in audio/device.rs"
run = '''
set -eu
failed=0
for rule in "mlua:src/script/" "cpal:src/audio/device.rs"; do
  name=${rule%%:*}
  allowed=${rule#*:}
  if offenders=$(grep -rln "use $name\|$name::" src/ | grep -v "^$allowed"); then
    echo "$name must stay in $allowed, found in:" >&2
    echo "$offenders" >&2
    failed=1
  fi
done
exit $failed
'''

[tasks.test]
description = "run the test suite"
depends = ["test:separation"]
run = "cargo test"

[tasks.play]
description = "play the example patch, then show the debug log"
run = "cargo run -- play lua/example.lua; cat synth.log"

[tasks.log]
description = "follow the debug log; pair with a TUI in another pane"
run = "touch synth.log; tail -F synth.log"

[tasks.doctor]
description = "report terminal capabilities and gating mode"
run = "cargo run -- doctor"

[tasks.check]
description = "lint the example patch; nonzero exit on warnings"
run = "cargo run -- check lua/example.lua"

[tasks.tui]
description = "play live from the keyboard with the default voice"
run = "cargo run -- tui"
